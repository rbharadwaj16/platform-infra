apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: translator-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rbharadwaj16/platform-infra.git
    targetRevision: HEAD
    path: platform-core/translator-service/overlays
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
