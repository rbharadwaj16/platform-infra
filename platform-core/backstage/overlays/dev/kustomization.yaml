apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: 01-backstage-argo-app-patch.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: backstage
  - path: 02-backstage-lb-svc.yaml
    target:
      group: ""
      version: v1
      kind: Service
      name: backstage
