apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      containers:
        - name: backstage
          image: acepocdemoregistry.azurecr.io/backstage:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7007
          env:
              - name: POSTGRES_HOST
                value: postgres
              - name: POSTGRES_PORT
                value: "5432"
              - name: POSTGRES_USER
                valueFrom:
                  secretKeyRef:
                    name: postgres-secrets
                    key: POSTGRES_USER
              - name: POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: postgres-secrets
                    key: POSTGRES_PASSWORD
            # - name: APP_CONFIG_backend_database_client
            #   value: pg
            # - name: APP_CONFIG_backend_database_connection_host
            #   value: postgres
            # - name: APP_CONFIG_backend_database_connection_port
            #   value: "5432"
