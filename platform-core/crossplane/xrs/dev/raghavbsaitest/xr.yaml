apiVersion: compute.aceplatform.org/v1alpha1
kind: XAKSCluster
metadata:
  name: raghavbsaitest
  namespace: default
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parameters:
    clusterName: raghavbsaitest
    resourceGroupName: myapp-rg
    location: eastus
    localAccountDisabled: false
    defaultNodePool:
      name: system
      vmSize: standard_dc2as_v5
      nodeCount: 1
      enableAutoScaling: false
