apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
spec:
  project: dev

  source:
    repoURL: git@github.com:rbharadwaj16/platform-infra.git
    targetRevision: main
    path: platform-core/argocd/apps/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
